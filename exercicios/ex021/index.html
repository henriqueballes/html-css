<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caixas</title>
    <style>
        h1 {
            width: 300px;
            height: 50px;
            background-color: lightgray;
            border-width: 10px;
            border-style: solid;
            border-color: red;
            padding: 20px;
            outline-width: 30px;
            outline-style: solid;
            outline-color: blue;
            margin: auto;
            margin-top: 31px;
            text-align: center;
            /*shorthand
            border: 10px solid red
            outline:30px solid blue
            a ordem para a configuração da shorthand é sempre a mesma:
            largura, estilo e cor*/
        }
        h2 {
            width: 300px;
            height: 50px;
            background-color: pink;
            text-align: center;

            border: 10px solid darkslategray;
            border-radius: 10px;

            padding: 10px;

            margin: 20px auto;
            margin-top: 40px;

            outline: 5px dashed salmon;
        }
        h2:hover {
            background-image: linear-gradient(to right, #6AC4D9, #448AA6);
        }
    </style>
</head>
<body>
    <h1>Exemplo de Caixa</h1>
    <h2>ola mundo</h2>
</body>
</html>
